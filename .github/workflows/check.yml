name: Check pages

on:
  pull_request:
  push:
    branches: [main]

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/check-seo.mjs

  # assets/site.css is built from src/tailwind.css and committed, since GitHub Pages
  # serves the repository as it is (issue #58). This fails when it wasn't rebuilt.
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - name: assets/site.css matches src/tailwind.css and the pages
        run: git diff --exit-code -- assets/site.css || { echo "::error::Run npm run build:css and commit assets/site.css."; exit 1; }
